# Extension publish: publishes the Extension (@pelrun/pi-reach) to GitHub Packages (npm.pkg.github.com).
# - Trigger: push to main when the version in pi-extension/package.json changes; can also be run
#   manually from the Actions page (no version comparison).
#   Skipped when the version is unchanged (e.g. dependency-only changes) or already published.
# - Registry: GitHub Packages of this repository. The npm scope must match the repository owner,
#   which is enforced by pi-extension/publish-npm.sh (@pelrun/pi-reach).
# - Auth: the workflow GITHUB_TOKEN with packages:write; no tokens are stored in the repo or GitHub.
#   GitHub Packages has no staging or approval step: the version goes live immediately after publish.
# - Upload: pi-extension/publish-npm.sh runs the Extension verify, pnpm pack and tarball checks,
#   then uploads the inspected tarball with npm publish.
# - Tag: on success the tag job creates extension-vX.Y.Z on this commit. GITHUB_TOKEN has no
#   workflows scope and may only tag commits whose .github/workflows match the latest commit on
#   main, so tagging must happen while this commit is still the latest, not after later merges.
#   The tag job holds contents: write separately from the packages: write publish job.
# - After publish: the GitHub Release is created by the Extension GitHub Release workflow
#   (extension-github-release.yml).
# Process and details: docs/DEPLOYMENT.md「Extension GitHub Packages 发布」.
name: Extension publish

on:
  push:
    branches: [forked-extension]
    paths: [pi-extension/package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to publish
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          skip() {
            echo "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          version="$(jq -r .version pi-extension/package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            previous="$(git show "$PUSH_BEFORE:pi-extension/package.json" 2>/dev/null | jq -r .version 2>/dev/null || true)"
            if [ "$previous" = "$version" ]; then skip "Extension version is still ${version}, skipping."; fi
          fi
          # GitHub Packages requires authentication for every read, even for public packages,
          # so the existence check fetches the authenticated packument and looks up the version.
          status="$(curl -sS --retry 3 --max-time 30 -o "$RUNNER_TEMP/packument.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://npm.pkg.github.com/@pelrun%2Fpi-reach")"
          case "$status" in
            200)
              if jq -e --arg v "$version" '.versions | has($v)' "$RUNNER_TEMP/packument.json" >/dev/null; then
                skip "@pelrun/pi-reach@$version is already published to GitHub Packages, skipping."
              fi
              ;;
            404) ;;
            *) echo "Cannot determine whether the version is already published to GitHub Packages (HTTP ${status})."; exit 1 ;;
          esac
          echo "release=true" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-workspace
        if: steps.decide.outputs.release == 'true'

      - name: Publish to GitHub Packages
        if: steps.decide.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bash pi-extension/publish-npm.sh

      - name: Summary
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          {
            echo "### @pelrun/pi-reach@$VERSION published to GitHub Packages"
            echo
            echo "The version is available immediately from https://npm.pkg.github.com; there is no approval step. If this version depends on new protocol frames or events, confirm the PWA is deployed before pairing clients against it. The Extension GitHub Release workflow creates the GitHub Release on its next scheduled run (scheduled workflows are disabled on newly imported forks until enabled once in the Actions page; it can also be run manually)."
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: tag
    needs: publish
    if: needs.publish.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag published commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: bash scripts/extension-github-release.sh tag "$VERSION" "$GITHUB_SHA"
