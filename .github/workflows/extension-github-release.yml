# Extension GitHub Release: creates the GitHub Release for the Extension based on the
# extension-vX.Y.Z tag once the version is available on GitHub Packages (the current version is
# marked Latest).
# - Background: the Extension publish workflow (release.yml) publishes to GitHub Packages and tags
#   the commit, but does not create the Release. GitHub cannot observe the publish moment from a
#   separate workflow, so this workflow checks on a schedule: when the current version is published
#   on GitHub Packages and the Release is missing, it is created; otherwise it skips until the next
#   run.
# - No tag creation: GITHUB_TOKEN cannot tag a commit whose .github/workflows differ from the latest
#   commit on main. Fails when a version is published but its tag is missing; tag manually and re-run.
# - Trigger: every 30 minutes by schedule, but GitHub schedules are best-effort and may lag for hours
#   or be skipped; scheduled workflows are also disabled on freshly imported forks until enabled once
#   in the Actions page. Can be run manually from the Actions page, with an optional historical
#   version to backfill.
# - Logic lives in scripts/extension-github-release.sh.
# Process: docs/DEPLOYMENT.md「版本标签与 GitHub Release」.
name: Extension GitHub Release

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Historical version to backfill (X.Y.Z); leave empty for the current version
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: extension-github-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/extension-github-release.sh release ${VERSION:+"$VERSION"}
